<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speakeasy — Install</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e0d4;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
      color: #f0e8dc;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 2.5rem;
    }

    .install-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.5rem;
      background: #f0e8dc;
      color: #0a0a0a;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
      margin-bottom: 1rem;
    }

    .install-btn:active { opacity: 0.75; }

    .note {
      font-size: 0.75rem;
      color: #555;
      line-height: 1.5;
    }

    .note strong { color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🥃</div>
    <h1>Speakeasy</h1>
    <p class="subtitle">Internal Build</p>

    <a class="install-btn"
       href="itms-services://?action=download-manifest&url=https://changruizzzz.github.io/speakeasy-ota/manifest.plist">
      Install on iPhone
    </a>

    <p class="note">
      <strong>Open this page in Safari</strong> — the install link
      does not work in Chrome or other browsers.
    </p>
  </div>
</body>
</html>
